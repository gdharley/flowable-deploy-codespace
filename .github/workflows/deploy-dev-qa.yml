
name: Deploy Flowable Platform

on:
  push:
    branches:
      - dev
      - main
      - release/*
    tags:
      - 'v*.*.*'

jobs:
  setup:
    runs-on: [self-hosted]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      kubeconfig-path: ${{ steps.set-kubeconfig.outputs.kubeconfig-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -LO "https://cdn.dl.k8s.io/release/$(curl -L -s https://cdn.dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          # Make the binary executable
          chmod +x kubectl
          # Move the binary to a directory in your system's PATH
          sudo mv ./kubectl /usr/local/bin/kubectl
      - name: Set kubeconfig output
        id: set-kubeconfig
        run: echo "kubeconfig-path=$HOME/.kube/config" >> $GITHUB_OUTPUT

  deploy-dev:
    needs: setup
    runs-on: [self-hosted, qa] # only runs on a self-hosted runner with the 'qa' label
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.ref == 'refs/heads/release/**' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'   # match your cluster

      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A

      - name: Use kind kubeconfig for qa cluster
        run: |
          export KUBECONFIG="${{ needs.setup.outputs.kubeconfig-path }}"
          kubectl config use-context kind-qa || echo "Context qa not found - this job assumes cluster already set."
      - name: Run deploy-flowable-platform.sh for dev/qa
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive --remote --force
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "dev" "flowable" "qa"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}

  deploy-test:
    needs: setup
    runs-on: [self-hosted, qa] # only runs on a self-hosted runner with the 'qa' label
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'   # match your cluster

      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A

      - name: Use kind kubeconfig for qa cluster
        run: |
          export KUBECONFIG="${{ needs.setup.outputs.kubeconfig-path }}"
          kubectl config use-context kind-qa || echo "Context qa not found - this job assumes cluster already set."
      - name: Run deploy-flowable-platform.sh for dev/qa
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive --remote --force
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "test" "flowable" "qa"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}

  deploy-stg:
    needs: setup
    runs-on: [self-hosted, prod] # only runs on a self-hosted runner with the 'prod' label
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name != '' && github.ref_type == 'tag' && github.event.base_ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A

      - name: Use kind kubeconfig for prod cluster
        run: |
          export KUBECONFIG="${{ needs.setup.outputs.kubeconfig-path }}"
          kubectl config use-context kind-prod || echo "Context prod not found - this job assumes cluster already set."
      - name: Run deploy-flowable-platform.sh for tagged release
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive --remote --force
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "stg" "flowable" "prod"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}
