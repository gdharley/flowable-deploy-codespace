global:
  security:
    allowInsecureImages: true
openldap:
  enabled: false
  replicas: 1
  service:
    name: openldap
    organization: Flowable Global Sales
    domain: global-sales.flowable.com
    adminPassword: test
  storage:
    provisioner: rancher.io/local-path
    size: 3Gi
    # Comment-out the following 2 lines in case you want bock instead of NFS
    storageClass: standard
    accessModes: ReadWriteOnce
  image:
    repository: osixia/openldap
    pullPolicy:
    tag: 1.5.0
    #    secret: gitlab-regcred
keycloak:
  enabled: true
  ingress:
    enabled: true
  replicas: 1
  # domainName: login
  host: supreme-robot-rjxpp4976gq3p96v-80.app.github.dev
  database:
    name: keycloak
  service:
    name: keycloak
  image:
    repository: "localhost:5001/keycloak-global-sales"
    pullPolicy:
    tag: "20.0.0"
    #    secret: gitlab-regcred
flowable:
