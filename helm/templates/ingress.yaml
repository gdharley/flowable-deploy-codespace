{{- if not .Values.flowable.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowable-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"       # leave HTTPS to GitHub
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
  - host:  # must be blank to use CodeSpaces app URL
    http:
      paths:
      - path: /design
        pathType: Prefix
        backend:
          service:
            name: flowable-design
            port:
              name: http
      - path: /work
        pathType: Prefix
        backend:
          service:
            name: flowable-work
            port:
              name: http
      - path: /control
        pathType: Prefix
        backend:
          service:
            name: flowable-control
            port:
              name: http
{{- end }}